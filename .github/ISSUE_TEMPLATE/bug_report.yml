name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems: please use private vulnerability reporting instead (see SECURITY.md).
        Remove case data, names, IP addresses and secrets from logs and screenshots before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an incident
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag (Admin → System status) or commit.
      placeholder: 1.0.0 / 6adea42
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Built from source (start.sh / docker compose build)
        - Release images (docker-compose.images.yml)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: e.g. `docker compose logs --tail 100 backend` (redacted).
      render: text
