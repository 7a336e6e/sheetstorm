name: Feature request
description: Suggest an improvement to the investigation workflow.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        SheetStorm tracks and documents investigations. Alert ingestion, triage queues and detection engines are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gets in your way during an investigation today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
