# Dependabot - dependency + base-image update PRs with a release-age cooldown.
# Policy: assets/docs/supply-chain.md
#  - cooldown: new versions must be >= 7 days old (npm/pip majors >= 14; docker
#    and actions only support default-days) before a PR is
#    opened, so freshly-published malicious releases (Shai-Hulud-style worms are
#    usually unpublished within hours/days) never reach a PR.
#  - version updates: one grouped weekly PR per ecosystem/directory for
#    minor/patch bumps; semver-major bumps are ignored and done manually.
#    pip is the exception: security updates only (see the pip comment below).
#  - security updates: grouped into one PR per ecosystem/directory.
#  - at most 2 open version-update PRs per entry (0 for pip).
#  - Dependabot only proposes PRs; every bump is still reviewed against the
#    vetting checklist and installed lockfile-only (`npm ci`, hash-locked pip).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    versioning-strategy: "increase"
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # pip: security updates only. Python deps are hash-locked (*.lock, installed
  # with --require-hashes) and Dependabot only edits the inputs
  # (requirements*.txt, constraints.txt, ...), so its version-update PRs never
  # build. Routine bumps are done by hand and relocked with
  # scripts/lock-python.sh. open-pull-requests-limit: 0 disables version
  # updates but keeps security PRs; those also need a relock with
  # scripts/lock-python.sh before merging. See assets/docs/supply-chain.md
  # section 5.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 0
    groups:
      pip-backend-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 0
    groups:
      pip-mcp-server-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/mcp-bridge"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 0
    groups:
      pip-mcp-bridge-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Digest-pinned base images (FROM image:tag@sha256:...) in every Dockerfile
  # and the image: lines in docker-compose.yml.
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
      - "/proxy"
      - "/database"
      - "/mcp-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-compose-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-compose-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # No workflows exist yet; this keeps future actions pinned/updated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
