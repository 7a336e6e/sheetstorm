# Release: push a tag vX.Y.Z (or vX.Y.Z-rc.N) to publish
#   ghcr.io/<owner>/sheetstorm-{backend,frontend,proxy,database,mcp-server}
# for linux/amd64 and linux/arm64 (native runners), with BuildKit SBOM +
# provenance and a GitHub build-provenance attestation per image, then a
# GitHub Release whose notes are the matching CHANGELOG section.
#
# Verify an image:  gh attestation verify oci://ghcr.io/<owner>/sheetstorm-backend:X.Y.Z --owner <owner>
# Dry run (build every image for both platforms, push nothing):
#   Actions -> Release -> Run workflow (dry_run: true)
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, push nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            publish=true
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
            publish=false
            [ "$DRY_RUN" = false ] && { echo "::error::Publishing requires a v* tag; run with dry_run or push a tag"; exit 1; }
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version"; exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          if [ "$publish" = true ] && [ "$prerelease" = false ] && ! grep -qE "^## \[?v?${version//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "registry=ghcr.io/${OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version (prerelease=$prerelease, publish=$publish)"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend, proxy, database, mcp-server]
        arch: [amd64, arm64]
    env:
      IMAGE: ${{ needs.prepare.outputs.registry }}/sheetstorm-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SHEETSTORM_VERSION=${{ needs.prepare.outputs.version }}
            SHEETSTORM_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=/api/v1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=sheetstorm-${{ matrix.image }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.prepare.outputs.publish }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, proxy, database, mcp-server]
    env:
      IMAGE: ${{ needs.prepare.outputs.registry }}/sheetstorm-${{ matrix.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Multi-platform manifest
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" = false ]; then
            tags+=(-t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest")
          fi
          refs=()
          for d in digests/*; do refs+=("$IMAGE@sha256:$(basename "$d")"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${refs[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes
        run: |
          # The CHANGELOG section for this version; a prerelease without one
          # uses "Unreleased".
          section() {
            awk -v want="$1" '
              /^## / { if (found) exit; h=$0; sub(/^## \[?v?/, "", h); sub(/[] ].*$/, "", h); if (h == want) { found=1; next } }
              found { print }' CHANGELOG.md
          }
          notes="$(section "$VERSION")"
          [ -z "$notes" ] && [ "$PRERELEASE" = true ] && notes="$(section Unreleased)"
          {
            echo "$notes"
            echo
            echo "## Container images"
            echo
            echo "Run them with \`SHEETSTORM_VERSION=$VERSION docker compose -f docker-compose.yml -f docker-compose.images.yml up -d\` (see the README)."
            echo
            for i in backend frontend proxy database mcp-server; do
              echo "- \`$REGISTRY/sheetstorm-$i:$VERSION\`"
            done
            echo
            echo "Verify: \`gh attestation verify oci://$REGISTRY/sheetstorm-backend:$VERSION --owner ${GITHUB_REPOSITORY_OWNER}\`"
          } > notes.md
      - name: Create release
        run: |
          flags=(--verify-tag --title "SheetStorm $VERSION" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" "${flags[@]}"
