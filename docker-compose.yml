services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: sheetstorm-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sheetstorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-sheetstorm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sheetstorm} -d ${POSTGRES_DB:-sheetstorm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: sheetstorm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sheetstorm-backend
    # Anchored so the `jobs` service runs with exactly the same settings.
    environment: &backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-sheetstorm}:${POSTGRES_PASSWORD:-changeme}@database:5432/${POSTGRES_DB:-sheetstorm}
      REDIS_URL: redis://redis:6379/0
      EVENTLET_NO_GREENDNS: 1
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      # HMAC key for chain-of-custody signatures (kept separate from SECRET_KEY
      # so rotating SECRET_KEY does not invalidate custody records).
      CUSTODY_SIGNING_KEY: ${CUSTODY_SIGNING_KEY:-}
      TSA_URL: ${TSA_URL:-}
      TSA_TIMEOUT_SECONDS: ${TSA_TIMEOUT_SECONDS:-10}
      TSA_MAX_RESPONSE_BYTES: ${TSA_MAX_RESPONSE_BYTES:-65536}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-sheetstorm-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_TIMEOUT: ${LOCAL_LLM_TIMEOUT:-120}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Comma-separated browser origins allowed to call the API with credentials.
      # Required when serving from anything other than localhost.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Auth cookies are Secure (HTTPS-only) in production. Set false only for
      # plain-HTTP, non-localhost deployments (not recommended).
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      # Hosts/CIDRs admins may target for self-hosted integrations (Ollama, MISP, ...).
      OUTBOUND_URL_ALLOWLIST: ${OUTBOUND_URL_ALLOWLIST:-}
      # Automatically enrich new IOCs via configured threat-intel integrations.
      IOC_AUTO_ENRICH: ${IOC_AUTO_ENRICH:-false}
      JWT_REFRESH_GRACE_SECONDS: ${JWT_REFRESH_GRACE_SECONDS:-30}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-600 per minute}
      RATE_LIMIT_SETTINGS_LOCKED: ${RATE_LIMIT_SETTINGS_LOCKED:-false}
      # Login lockout after N bad passwords/MFA codes (3..20) for M minutes (1..1440).
      LOGIN_LOCKOUT_THRESHOLD: ${LOGIN_LOCKOUT_THRESHOLD:-10}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      # Lifetime of admin-issued password reset links, in hours (1..72).
      PASSWORD_RESET_TTL_HOURS: ${PASSWORD_RESET_TTL_HOURS:-24}
      # Audit log hash chain key (HMAC). Empty: falls back to SECRET_KEY with a
      # startup warning. PREVIOUS_KEYS (comma list) keeps rows signed with
      # rotated keys verifiable.
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:-}
      AUDIT_CHAIN_PREVIOUS_KEYS: ${AUDIT_CHAIN_PREVIOUS_KEYS:-}
      AUDIT_EXPORT_MAX_ROWS: ${AUDIT_EXPORT_MAX_ROWS:-100000}
      AUDIT_PURGE_BATCH_SIZE: ${AUDIT_PURGE_BATCH_SIZE:-10000}
      # API key hash pepper (openssl rand -hex 32). Empty: derived from
      # SECRET_KEY with a startup warning.
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      API_KEY_TOKEN_TTL_MINUTES: ${API_KEY_TOKEN_TTL_MINUTES:-15}
      # Build metadata shown to platform admins in the system status.
      APP_VERSION: ${APP_VERSION:-}
      GIT_COMMIT: ${GIT_COMMIT:-}
      # Local evidence storage directory; must match the artifacts_data mount.
      LOCAL_ARTIFACT_DIR: ${LOCAL_ARTIFACT_DIR:-/app/artifacts}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sheetstorm.local}
      # Empty: the seed generates a random admin password and prints it once.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Local evidence storage (used when no S3/Drive backend is configured).
      - artifacts_data:/app/artifacts
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Periodic maintenance (`flask sheetstorm run-jobs`: retention, reminders,
  # session pruning, ...). Same image and settings as the backend; no ports,
  # no migrations (entrypoint bypassed: it starts after the backend is healthy).
  # Without this service, run the command from host cron instead.
  jobs:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sheetstorm-jobs
    entrypoint: []
    command: ["sh", "-c", "while true; do flask sheetstorm run-jobs; sleep \"$${JOBS_INTERVAL_SECONDS:-300}\"; done"]
    environment:
      <<: *backend-env
      FLASK_APP: app:create_app
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-300}
    volumes:
      - artifacts_data:/app/artifacts
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: sheetstorm-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: sheetstorm-mcp
    environment:
      SHEETSTORM_API_URL: http://backend:5000/api/v1
      MCP_TRANSPORT: sse
      SSE_PORT: "8811"
      MCP_ISSUER_URL: ${MCP_ISSUER_URL:-http://localhost:8811}
      # Extra OAuth redirect hosts MCP clients may use (comma-separated).
      MCP_ALLOWED_REDIRECT_HOSTS: ${MCP_ALLOWED_REDIRECT_HOSTS:-}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8811:8811"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from sheetstorm_mcp.server import mcp; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped


  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: sheetstorm-proxy
    environment:
      # Upstream proxies/load balancers whose forwarded client-IP header nginx
      # may believe (comma/space-separated IPs or CIDRs). Empty = trust nobody
      # (secure default for direct exposure). List only proxies you control.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Header carrying the client IP: X-Forwarded-For, X-Real-IP,
      # CF-Connecting-IP or True-Client-IP.
      REAL_IP_HEADER: ${REAL_IP_HEADER:-X-Forwarded-For}
    ports:
      - "8080:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional local LLM. Enable with:  docker compose --profile local-llm up -d
  # then set an `ollama` AI integration with base_url http://ollama:11434
  # (no host port is published: the backend reaches it over the compose network;
  # if you point OUTBOUND_URL_ALLOWLIST at it, add `ollama`).
  ollama:
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    container_name: sheetstorm-ollama
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  artifacts_data:
