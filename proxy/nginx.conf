# --- Client IP extraction -----------------------------------------------------
# /etc/nginx/realip.conf is generated at container start from the
# TRUSTED_PROXY_CIDRS and REAL_IP_HEADER environment variables. By default no
# proxies are trusted: $remote_addr is the TCP peer and every client-supplied
# IP/proto/host header is ignored. When trusted proxies are configured it also
# defines $trusted_peer (1 = the connecting peer is a trusted proxy).
include /etc/nginx/realip.conf;

# CDN geo headers: only forwarded from a trusted peer (empty value = omitted).
map $trusted_peer $cf_ipcountry { 1 $http_cf_ipcountry; default ""; }
map $trusted_peer $cf_ipcity    { 1 $http_cf_ipcity;    default ""; }
map $trusted_peer $cf_region    { 1 $http_cf_region;    default ""; }
map $trusted_peer $cf_ray       { 1 $http_cf_ray;       default ""; }

# Scheme seen by the end user. TLS is normally terminated upstream of this
# container, so $scheme is "http" here; X-Forwarded-Proto is believed only from
# a trusted proxy.
map "$trusted_peer:$http_x_forwarded_proto" $forwarded_proto {
    default    $scheme;
    "1:https"  https;
    "1:http"   http;
}

# HSTS only when the effective scheme is https.
map "$scheme:$trusted_peer:$http_x_forwarded_proto" $hsts_header {
    default           "";
    "~^https:"        "max-age=31536000; includeSubDomains";
    "http:1:https"    "max-age=31536000; includeSubDomains";
}

upstream frontend {
    zone upstream_frontend 64k;
    server frontend:3000 resolve;  # re-resolved via the generated resolver
}

upstream backend {
    zone upstream_backend 64k;
    server backend:5000 resolve;  # re-resolved via the generated resolver
}

upstream mcp {
    zone upstream_mcp 64k;
    server mcp-server:8811 resolve;  # re-resolved via the generated resolver
}

server {
    listen 80;
    server_name sheetstorm.hackstack.xyz;

    # Security headers. Upstream copies are hidden so each header is sent once
    # with a single, consistent value (the Next.js CSP is left untouched).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security $hsts_header always;

    # Max upload size (for artifact uploads etc.)
    client_max_body_size 100M;

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-IPCountry $cf_ipcountry;
        proxy_set_header CF-IPCity $cf_ipcity;
        proxy_set_header CF-Region $cf_region;
        proxy_set_header CF-Ray $cf_ray;

        # Timeouts for long-running API calls (AI, reports, etc.)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Socket.IO WebSocket + polling
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-IPCountry $cf_ipcountry;
        proxy_set_header CF-IPCity $cf_ipcity;
        proxy_set_header CF-Region $cf_region;
        proxy_set_header CF-Ray $cf_ray;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP Server SSE endpoint
    location /sse {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP Server message endpoint
    location /messages/ {
        proxy_pass http://mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Authorization $http_authorization;
    }

    # MCP Streamable HTTP endpoint (used by Gemini CLI and newer MCP clients)
    location /mcp {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP OAuth endpoints (authorization, token, registration, revocation, metadata)
    # Note: /register is excluded here — it's the frontend's registration page.
    # MCP OAuth dynamic client registration uses /oauth-register instead.
    location ~ ^/(authorize|token|oauth-register|revoke|sheetstorm-login|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource) {
        proxy_pass http://mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Everything else → frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Health check endpoint for load balancers / monitoring
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
